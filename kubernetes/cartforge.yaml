apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartforge
  template:
    metadata:
      labels:
        app: cartforge
    spec:
      containers:
        - name: cartforge
          image: cartforge:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: cartforge
spec:
  type: NodePort
  selector:
    app: cartforge
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
